<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>每日设计灵感 · 2026-10-13</title>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--bg:#fafafa;--card:#fff;--fg:#1d1d1f;--muted:#6e6e73;--border:#e5e5e8;--accent:#f0f0f2;--grid:rgba(0,0,0,.045);--hi:#1d1d1f;--star:#f5a524;--shadow:0 24px 70px -48px rgba(24,24,27,.75);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#080808;--card:#111;--fg:#ededed;--muted:#8e8e93;--border:#282828;--accent:#1c1c1e;--grid:rgba(255,255,255,.05);--hi:#ededed;--shadow:0 24px 70px -40px #000}}
*{box-sizing:border-box;margin:0}
body{font-family:"Geist",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.55;overflow-x:hidden}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(40% 35% at 75% 10%,color-mix(in oklch,var(--fg) 6%,transparent),transparent 72%),linear-gradient(var(--grid) 1px,transparent 1px) 0 0/72px 72px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/72px 72px;-webkit-mask-image:linear-gradient(#000 30%,transparent 80%);mask-image:linear-gradient(#000 30%,transparent 80%)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 0;font-size:14px}
header b{font-weight:600}header span{color:var(--muted)}
.hero{padding:48px 0 32px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(34px,6vw,56px);font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:10px 0 12px}
.lead{color:var(--muted);max-width:560px;font-size:15px}
.in{animation:in .6s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(20px);filter:blur(10px)}}
.nb{animation-name:nb}@keyframes nb{from{opacity:0;transform:translateY(20px)}}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr))}
.card{background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.shot{display:block;aspect-ratio:16/10;background:var(--accent);border-bottom:1px solid var(--border);overflow:hidden}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .6s var(--ease)}
.card:hover .shot img{transform:scale(1.02)}
.body{padding:20px;display:flex;flex-direction:column;gap:10px;flex:1}
.ttl{display:flex;align-items:center;gap:8px;justify-content:space-between}
.ttl h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.ttl a{font-size:12px;color:var(--muted);text-decoration:none}
.ttl a:hover{color:var(--fg)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--muted)}
.hl{font-size:14.5px}
details{font-size:13px;color:var(--muted)}
summary{cursor:pointer;color:var(--fg);font-size:13px;list-style:none;display:inline-flex;align-items:center;gap:4px}
summary::-webkit-details-marker{display:none}
summary:after{content:"＋";font-size:11px;transition:transform .3s var(--ease)}details[open] summary:after{transform:rotate(45deg)}
details ul{padding-left:18px;margin-top:8px;display:grid;gap:4px}
.act{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
.df-stars{display:flex;gap:2px;min-height:30px;align-items:center}
.df-stars button{padding:4px!important;line-height:1;color:var(--star)!important;transition:transform .2s var(--ease)}
.df-stars button:hover{transform:scale(1.15)}
.df-fav{font-family:inherit;font-size:13px;color:var(--muted);background:var(--accent);border:1px solid var(--border);border-radius:999px;padding:6px 14px;cursor:pointer;min-height:32px;transition:background .3s var(--ease),color .3s var(--ease),transform .2s var(--ease)}
.df-fav:hover{color:var(--fg)}.df-fav:active{transform:scale(.96)}
.sum{font-size:13px;color:var(--muted)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:6px}
footer{border-top:1px solid var(--border);margin:24px 0 40px;padding-top:20px;font-size:12px;color:var(--muted)}
@media (max-width:640px){.hero{padding:28px 0 20px}.body{padding:16px}}
@media (prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
