<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>每日设计灵感 · {{DATE}}</title>
<style>
:root{--ease:cubic-bezier(.22,1,.36,1);--bg:#fafafa;--card:#fff;--fg:#1d1d1f;--muted:#6e6e73;--border:#e5e5e8;--accent:#f0f0f2;--grid:rgba(0,0,0,.045);--shadow:0 24px 70px -48px rgba(24,24,27,.75);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#080808;--card:#111;--fg:#ededed;--muted:#8e8e93;--border:#282828;--accent:#1c1c1e;--grid:rgba(255,255,255,.05);--shadow:0 24px 70px -40px #000}}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:"Geist",-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;overflow-x:hidden;font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(var(--grid) 1px,transparent 1px) 0 0/48px 48px,linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/48px 48px;-webkit-mask-image:linear-gradient(#000,transparent 60%);mask-image:linear-gradient(#000,transparent 60%)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 0;font-size:14px}.top b{font-weight:600}.top span{color:var(--muted)}
.hero{padding:24px 0 8px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
h1{font-size:clamp(32px,8vw,52px);font-weight:600;letter-spacing:-.03em;line-height:1.1;margin:8px 0 10px}
.lead{color:var(--muted);font-size:15px}
.nav{position:sticky;top:0;z-index:50;margin:16px -16px 8px;padding:10px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;background:color-mix(in oklch,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.nav::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:13px;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--fg);text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.chip.app:before{content:"App · ";color:var(--muted)}
.in{animation:in .6s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(20px);filter:blur(10px)}}
.blocks{display:grid;gap:24px;margin-top:8px}
.block{background:var(--card);border:1px solid var(--border);border-radius:24px;overflow:hidden;scroll-margin-top:64px}
.bh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:16px 18px 12px}
.bh h2{font-size:20px;font-weight:600;letter-spacing:-.02em}
.bh .sub{font-size:13px;color:var(--muted);flex-basis:100%}
.kind{font-size:12px;font-weight:600;letter-spacing:.06em;padding:2px 8px;border-radius:6px;background:var(--accent);color:var(--muted)}
.kind.app{background:var(--fg);color:var(--bg)}
.focus{font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;margin-left:6px;border:1px solid currentColor}
.focus.f-ix{color:#2c76a0}.focus.f-ui{color:#8a5a00}.focus.f-both{color:#5b4bb0}
.hf{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 10px;font-size:15px}.hf dt{font-weight:600;color:var(--muted);white-space:nowrap}.hf dd{margin:0;min-width:0;overflow-wrap:anywhere}
.short{margin:0 0 16px;padding:10px 12px;border-radius:10px;background:var(--accent);font-size:14px}
.demo{position:relative;border-top:1px solid var(--border);border-bottom:1px solid var(--border);overflow:hidden;isolation:isolate}
.bb{padding:16px 18px 14px;display:grid;gap:10px}
.why{font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:12px;padding:2px 9px;border-radius:999px;background:var(--accent);color:var(--muted)}
details{font-size:14px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px}
summary{cursor:pointer;color:var(--fg);list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:44px}
summary::-webkit-details-marker{display:none}
summary:after{content:"+";font-size:18px;color:var(--muted);transition:transform .3s var(--ease)}details[open] summary:after{transform:rotate(45deg)}
.params{overflow-wrap:anywhere;padding-left:18px;display:grid;gap:4px;margin:4px 0 6px}
.code{display:block;width:100%;margin:6px 0;border:1px solid var(--border);border-radius:12px;background:var(--accent);color:var(--fg);font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:12px;resize:vertical;white-space:pre;overflow:auto}
.ref{display:flex;gap:12px;align-items:center;border-top:1px solid var(--border);padding-top:10px}
.thumb{width:96px;height:auto;max-height:120px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--border);flex:none}
.links{display:grid;gap:2px;font-size:13px}.links a{color:var(--muted);display:inline-flex;align-items:center;min-height:44px}.note{font-size:12px;color:var(--muted)}
.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;border-top:1px solid var(--border);padding-top:10px;min-height:44px}
.df-stars{display:flex;gap:2px;align-items:center}
.df-stars button{padding:6px 4px!important;min-width:44px;min-height:44px;line-height:1;font-size:22px!important;color:#f5a524!important;transition:transform .2s var(--ease)}
.df-stars button:active{transform:scale(1.2)}
.df-fav{font-family:inherit;font-size:14px;color:var(--fg);background:var(--accent);border:1px solid var(--border);border-radius:999px;padding:8px 16px;min-height:44px;cursor:pointer;transition:transform .2s var(--ease)}
.df-fav:active{transform:scale(.96)}
.replay{position:absolute;right:10px;bottom:10px;z-index:20;font:500 13px/1 inherit;font-family:inherit;padding:9px 14px;border-radius:999px;border:1px solid rgba(128,128,128,.35);background:rgba(255,255,255,.85);color:#111;cursor:pointer;min-height:44px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.replay:active{transform:scale(.96)}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid #4c8dff;outline-offset:2px}
.am{display:grid;gap:14px;padding:22px 16px 18px;background:var(--am-bg,#f5f5f7);color:#1d1d1f}
.am-ph{position:relative;margin:0 auto;width:min(66vw,260px);aspect-ratio:480/1040;border-radius:30px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.06),0 24px 50px -28px rgba(24,24,27,.55)}
.am-ph.tall{aspect-ratio:480/1088}
.am-v{display:block;width:100%;height:100%;object-fit:cover}
.am-tap{position:absolute;inset:0;border:0;background:transparent;cursor:pointer;display:grid;place-items:center;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.am-tap span{font:500 13px/1 inherit;font-family:inherit;padding:10px 16px;border-radius:999px;background:rgba(255,255,255,.88);color:#111;box-shadow:0 6px 20px -8px rgba(0,0,0,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);opacity:0;transform:scale(.92);transition:opacity .25s var(--ease),transform .25s var(--ease)}
.am.paused .am-tap span{opacity:1;transform:none}
.am.err .am-tap span:after{content:" · 加载失败"}
.am-steps{list-style:none;padding:0;display:grid;gap:8px;font-size:15px;line-height:1.5}
.am-steps li{display:flex;gap:10px;align-items:baseline}
.am-steps b{flex:none;min-width:40px;font:600 12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;color:#6e6e73}
.am-src{font-size:12px;color:#6e6e73}
@media (min-width:640px){.am{grid-template-columns:260px 1fr;align-items:center;column-gap:28px;padding:26px 28px}.am-ph{width:260px;grid-row:span 2}}
footer{margin:32px 0 40px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:16px}
@media (min-width:720px){.bh{padding:20px 24px 14px}.bb{padding:18px 24px 16px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body><div class="bgfx"></div>
<div class="wrap">
<div class="top in"><b>每日设计灵感</b><span>{{DATE}}</span></div>
<section class="hero"><div class="eyebrow in" style="animation-delay:.08s">Web demo + App 原视频 · {{COUNT}} 个</div>
<h1 class="in" style="animation-delay:.14s">把好设计<br>拆开来玩</h1>
<p class="lead in" style="animation-delay:.22s">Web 块是用代码复刻的可交互 demo，参数取自原站源码；App 块直接放 Mobbin 上的原视频，已下载进页面，点画面可暂停/播放。打星、收藏会自动同步。</p></section>
<nav class="nav" aria-label="目录">{{NAV}}</nav>
<section class="blocks">
{{BLOCKS}}
</section>
<footer>{{DATE}} · 原站商标、截图与录屏版权归各自所有 · Web demo 用占位文字/图形复刻 · App 视频与截图来自 Mobbin</footer>
</div>
<script>
// 通用：重播按钮——给 .demo 内 [data-replay] 根元素移除再加回 .play 类
document.querySelectorAll('.replay').forEach(b=>b.addEventListener('click',()=>{const r=b.closest('.demo').querySelector('[data-replay]');r.classList.remove('play');void r.offsetWidth;r.classList.add('play');r.dispatchEvent(new Event('replay'))}));
// 进入视口才播放（手机上滚到才动）
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('play');e.target.dispatchEvent(new Event('replay'));io.unobserve(e.target)}}),{threshold:.35});
document.querySelectorAll('[data-replay]').forEach(el=>io.observe(el));
// App 原视频：素材是 base64 文本（GitHub 连接器只能传文本），进视口前 fetch 解码成 Blob 再播放；
// 减少动态时不自动播放（显示封面 + 点按播放）；离开视口暂停；点画面切换播放/暂停
(()=>{const rm=matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.am').forEach(box=>{const v=box.querySelector('video'),b=box.querySelector('.am-tap');if(!v)return;let user=false,vis=false,ld=null;
const sync=()=>box.classList.toggle('paused',v.paused);v.addEventListener('play',sync);v.addEventListener('pause',sync);
if(rm){v.autoplay=false;v.removeAttribute('autoplay')}
const load=()=>ld||(ld=(v.dataset.b64?fetch(v.dataset.b64).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()}).then(t=>{const s=atob(t.replace(/\s+/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);v.src=URL.createObjectURL(new Blob([u],{type:'video/mp4'}))}):Promise.resolve()).catch(()=>box.classList.add('err')));
sync();b.addEventListener('click',()=>{user=true;load().then(()=>{if(v.paused)v.play().catch(()=>{});else v.pause()})});
new IntersectionObserver(es=>es.forEach(e=>{vis=e.isIntersecting;if(vis)load().then(()=>{if(!rm&&!user&&vis)v.play().catch(sync)});else if(!user)v.pause()}),{rootMargin:'200px 0px'}).observe(v)})})();
</script>
<script src="design-feedback.js" data-date="{{DATE}}"></script>
</body></html>
