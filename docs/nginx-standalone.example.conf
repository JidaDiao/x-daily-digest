# Example fragments from the daily.jidadiao.fun site.
# Reconstructed for handover; the live file lives only on the VPS:
#   /etc/nginx/sites-available/daily.jidadiao.fun
# Do not copy certificate paths or other sites into the repo.
# The floating back button style is owned by /pwa-nav.js — do not restyle it in CSS here.

