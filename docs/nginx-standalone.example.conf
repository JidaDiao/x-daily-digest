#     sub_filter_once on;
#     sub_filter_types text/html;
#     sub_filter "</body>" "<script src="/read-beacon.js" defer></script><script src="/pwa-nav.js?v=1" defer></script></body>";
#   }
#
#   location /design/ {
#     alias /srv/daily/site/design/;
#     sub_filter_once on;
#     sub_filter_types text/html;
#     sub_filter "</body>" "<script src="/read-beacon.js" defer></script><script src="/pwa-nav.js?v=1" defer></script></body>";
#   }
#
#   location /favorites/ { alias /srv/daily/favorites/; autoindex on; autoindex_exact_size off; charset utf-8; }
#   location /go/  { proxy_pass http://127.0.0.1:9090; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
